version: "3.9"

x-kafka-common: &kafka-common
  image: bitnamilegacy/kafka:3.4
  environment: &kafka-common-env
    KAFKA_ENABLE_KRAFT: "yes"
    KAFKA_CFG_PROCESS_ROLES: broker,controller
    KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
    # KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
    KAFKA_KRAFT_CLUSTER_ID: abcdefghijklmnopqrstuv
    KAFKA_CFG_LISTENERS: PLAINTEXT://:9091,SSL://:9092,CONTROLLER://:9093,EXTERNAL_SSL://:9094
    KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SSL:SSL,EXTERNAL_SSL:SSL
    KAFKA_CFG_INTER_BROKER_LISTENER_NAME: SSL
    KAFKA_CFG_SSL_KEYSTORE_PASSWORD: keystore_password
    KAFKA_CFG_SSL_KEY_PASSWORD: sslkey_password
    KAFKA_CFG_SSL_TRUSTSTORE_PASSWORD: truststore_password
    KAFKA_CFG_SSL_CLIENT_AUTH: none
    # KAFKA_CFG_SSL_PRINCIPAL_MAPPING_RULES: "RULE:^CN=([^,]+).*$/$1/,DEFAULT"
    # ALLOW_PLAINTEXT_LISTENER: "yes"
    # KAFKA_CFG_AUTHORIZER_CLASS_NAME: org.apache.kafka.metadata.authorizer.StandardAuthorizer
    # KAFKA_CFG_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "false"
    # KAFKA_CFG_SUPER_USERS: User:ANONYMOUS
    # KAFKA_CLIENT_USERS: kafka-connect
    # KAFKA_CLIENT_USER_PASSWORDS: kafka-connect-password
  volumes:
    - ./infra/certificates/kafka/stores:/bitnami/kafka/config/certs
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9091 2>/dev/null || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 30s

services:
  kafka-1:
    <<: *kafka-common
    container_name: kafka-1
    ports:
      - "9094:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9091,SSL://kafka-1:9092,EXTERNAL_SSL://127.0.0.1:9094

  kafka-2:
    <<: *kafka-common
    container_name: kafka-2
    ports:
      - "9095:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9091,SSL://kafka-2:9092,EXTERNAL_SSL://127.0.0.1:9095

  kafka-3:
    <<: *kafka-common
    container_name: kafka-3
    ports:
      - "9096:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_CFG_NODE_ID: "3"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9091,SSL://kafka-3:9092,EXTERNAL_SSL://127.0.0.1:9096

  schema-registry:
    image: bitnamilegacy/schema-registry:7.6
    container_name: schema-registry
    ports:
      - '127.0.0.1:8081:8081'                           # API для регистрации/получения схем
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    environment:
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKA_BROKERS: SSL://kafka-1:9092,SSL://kafka-2:9092,SSL://kafka-3:9092
      SCHEMA_REGISTRY_KAFKASTORE_SECURITY_PROTOCOL: SSL
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_LOCATION: /opt/bitnami/schema-registry/certs/schema-registry.truststore.jks
      SCHEMA_REGISTRY_KAFKASTORE_SSL_TRUSTSTORE_PASSWORD: truststore_password
      SCHEMA_REGISTRY_KAFKASTORE_SSL_CIPHER_SUITES: TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
    volumes:
      - ./infra/certificates/kafka/stores/kafka.truststore.jks:/opt/bitnami/schema-registry/certs/schema-registry.truststore.jks:ro
      - ./infra/schema-registry/schema-registry.properties:/bitnami/schema-registry/etc/schema-registry/schema-registry.properties:ro

  schema-registry-init:
    image: dwdraju/alpine-curl-jq:latest
    container_name: schema-registry-init
    depends_on:
      schema-registry:
        condition: service_started
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    volumes:
      - ./infra/schema-registry/init.sh:/scripts/init.sh:ro
      - ./infra/schema-registry/product-schema.json:/schemas/product-schema.json:ro
      - ./infra/schema-registry/product-payload-schema.json:/schemas/product-payload-schema.json:ro
      - ./infra/schema-registry/client-request.json:/schemas/client-request.json:ro
    entrypoint: ["/bin/bash", "/scripts/init.sh"]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.0
    container_name: kafka-ui
    restart: always
    ports:
      - "127.0.0.1:8085:8080"                           # Интерфейс доступен на localhost:8080
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092 # Указываем, где искать брокер Kafka
      KAFKA_CLUSTERS_0_NAME: kraft                     # Название кластера в UI
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SSL
      KAFKA_CLUSTERS_0_SSL_TRUSTSTORELOCATION: /etc/kafka/certs/kafka.truststore.jks
      KAFKA_CLUSTERS_0_SSL_TRUSTSTOREPASSWORD: truststore_password
    volumes:
      - ./infra/certificates/kafka/stores/kafka.truststore.jks:/etc/kafka/certs/kafka.truststore.jks:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  kafka-init:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-init
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    volumes:
      - ./infra/certificates/ca/certs/ca.crt:/etc/kafka/certs/ca.crt:ro
      - ./infra/kafka/client.properties:/etc/kafka/client.properties:ro
      - ./infra/kafka/kafka-init.sh:/kafka-init.sh:ro
    entrypoint: ["/bin/bash", "/kafka-init.sh"]

  kafka-mirror-1:
    <<: *kafka-common
    container_name: kafka-mirror-1
    ports:
      - "9084:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-mirror-1:9093,2@kafka-mirror-2:9093,3@kafka-mirror-3:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9091,SSL://kafka-mirror-1:9092,EXTERNAL_SSL://127.0.0.1:9084

  kafka-mirror-2:
    <<: *kafka-common
    container_name: kafka-mirror-2
    ports:
      - "9085:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-mirror-1:9093,2@kafka-mirror-2:9093,3@kafka-mirror-3:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9091,SSL://kafka-mirror-2:9092,EXTERNAL_SSL://127.0.0.1:9085

  kafka-mirror-3:
    <<: *kafka-common
    container_name: kafka-mirror-3
    ports:
      - "9086:9094"
    environment:
      <<: *kafka-common-env
      KAFKA_CFG_NODE_ID: "3"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka-mirror-1:9093,2@kafka-mirror-2:9093,3@kafka-mirror-3:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9091,SSL://kafka-mirror-3:9092,EXTERNAL_SSL://127.0.0.1:9086

  kafka-mirror-ui:
    image: provectuslabs/kafka-ui:v0.7.0
    container_name: kafka-mirror-ui
    restart: always
    ports:
      - "127.0.0.1:8086:8080"                           # Интерфейс доступен на localhost:8086
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: kafka-mirror-1:9092,kafka-mirror-2:9092,kafka-mirror-3:9092 # Указываем, где искать брокер Kafka
      KAFKA_CLUSTERS_0_NAME: kraft                     # Название кластера в UI
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SSL
      KAFKA_CLUSTERS_0_SSL_TRUSTSTORELOCATION: /etc/kafka/certs/kafka.truststore.jks
      KAFKA_CLUSTERS_0_SSL_TRUSTSTOREPASSWORD: truststore_password
    volumes:
      - ./infra/certificates/kafka/stores/kafka.truststore.jks:/etc/kafka/certs/kafka.truststore.jks:ro
    depends_on:
      kafka-mirror-init:
        condition: service_completed_successfully

  mirrormaker2:
    image: bitnamilegacy/kafka:3.4
    container_name: mirrormaker2
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      kafka-mirror-init:
        condition: service_completed_successfully
    volumes:
      - ./infra/mirrormaker2/mm2.properties:/etc/mm2/mm2.properties:ro
      - ./infra/certificates/kafka/stores/kafka.truststore.jks:/etc/kafka/certs/kafka.truststore.jks:ro
    entrypoint: ["/opt/bitnami/kafka/bin/connect-mirror-maker.sh", "/etc/mm2/mm2.properties"]
    restart: on-failure

  shop-service:
    build:
      context: .
      dockerfile: Dockerfile.shop-service
    container_name: shop-service
    environment:
      - KAFKA_BOOTSTRAP=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - KAFKA_SSL_CA_LOCATION=/etc/kafka/certs/ca.crt
      - KAFKA_TOPIC=topic-1
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
    volumes:
      - ./infra/certificates/ca/certs/ca.crt:/etc/kafka/certs/ca.crt:ro
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry-init:
        condition: service_completed_successfully

  prometheus:
    image: prom/prometheus:v2.30.3
    container_name: prometheus
    ports:
    - "9090:9090"
    volumes:
    - ./infra/prometheus:/etc/prometheus
    command: --web.enable-lifecycle --config.file=/etc/prometheus/prometheus.yml
    links:
    - kafka-connect

  grafana:
    build:
     context: ./infra/grafana
    container_name: grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Editor
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/connect.json
    ports:
    - "3000:3000"

  postgres:
    image: debezium/postgres:16
    hostname: postgres
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres                  # Имя пользователя
      POSTGRES_PASSWORD: postgres                   # Пароль
      POSTGRES_DB: postgres                           # Название базы данных
    volumes:
      - ./infra/postgres/config.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-init:
    image: debezium/postgres:16
    container_name: postgres-init
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/postgres-init.sh"]
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./infra/postgres/postgres-init.sh:/scripts/postgres-init.sh

  kafka-connect:
    build:
      context: ./infra/kafka-connect
    container_name: kafka-connect
    ports:
      - "8083:8083"  # REST API Kafka Connect
      - "9875:9875"
      - "9876:9876"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: 'kafka-connect'
      CONNECT_REST_ADVERTISED_HOST_NAME: 'localhost'

      # Хранение конфигурации, смещений и статусов
      CONNECT_CONFIG_STORAGE_TOPIC: 'connect-config-storage'
      CONNECT_OFFSET_STORAGE_TOPIC: 'connect-offset-storage'
      CONNECT_STATUS_STORAGE_TOPIC: 'connect-status-storage'
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 2
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 2
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 2

      # Конвертеры
      CONNECT_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER: "io.confluent.connect.json.JsonSchemaConverter"
      CONNECT_VALUE_CONVERTER_SCHEMA_REGISTRY_URL: 'http://schema-registry:8081'
      CONNECT_INTERNAL_KEY_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"
      CONNECT_INTERNAL_VALUE_CONVERTER: "org.apache.kafka.connect.json.JsonConverter"

      KAFKA_JMX_PORT: '9875'
      KAFKA_OPTS: "-javaagent:/opt/jmx_prometheus_javaagent-0.15.0.jar=9876:/opt/kafka-connect.yml"

      # Пути к плагинам
      CONNECT_PLUGIN_PATH: /usr/share/java,/etc/kafka-connect/jars

      # SSL
      CONNECT_SECURITY_PROTOCOL: SSL
      CONNECT_SSL_TRUSTSTORE_LOCATION: /etc/kafka/certs/kafka.truststore.jks
      CONNECT_SSL_TRUSTSTORE_PASSWORD: truststore_password
      CONNECT_PRODUCER_SECURITY_PROTOCOL: SSL
      CONNECT_PRODUCER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/certs/kafka.truststore.jks
      CONNECT_PRODUCER_SSL_TRUSTSTORE_PASSWORD: truststore_password
      CONNECT_CONSUMER_SECURITY_PROTOCOL: SSL
      CONNECT_CONSUMER_SSL_TRUSTSTORE_LOCATION: /etc/kafka/certs/kafka.truststore.jks
      CONNECT_CONSUMER_SSL_TRUSTSTORE_PASSWORD: truststore_password
    volumes:
      - ./infra/confluent-hub-components/:/etc/kafka-connect/jars
      - ./infra/certificates/kafka/stores/kafka.truststore.jks:/etc/kafka/certs/kafka.truststore.jks:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  kafka-connect-init:
    image: confluentinc/cp-kafka-connect:latest
    container_name: kafka-connect-init
    depends_on:
      kafka-connect:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/kafka-connect-init.sh"]
    environment:
      KAFKA_CONNECT_URIS: http://kafka-connect:8083
    volumes:
      - ./infra/kafka-connect/init.sh:/scripts/kafka-connect-init.sh

