  #     - KAFKA_BOOTSTRAP=kafka-1:9092,kafka-2:9092,kafka-3:9092
  #     - KAFKA_SSL_CA_LOCATION=/etc/kafka/certs/ca.crt
  #   volumes:
  #     - ./infra/certificates/ca/certs/ca.crt:/etc/kafka/certs/ca.crt:ro

  client-service:
    build:
      context: .
      dockerfile: Dockerfile.client-service
    container_name: client-service
    ports:
      - "8080:8080"
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      kafka-connect-init:
        condition: service_completed_successfully
      schema-registry-init:
        condition: service_completed_successfully
    environment:
      - HTTP_ADDR=:8080
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - POSTGRES_DSN=postgres://postgres:postgres@postgres:5432/postgres
      - KAFKA_BOOTSTRAP=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - KAFKA_SSL_CA_LOCATION=/etc/kafka/certs/ca.crt
    volumes:
      - ./infra/certificates/ca/certs/ca.crt:/etc/kafka/certs/ca.crt:ro

  debezium-ui:
    image: debezium/debezium-ui:2.1.2.Final
    container_name: debezium-ui
    ports:
      - "8087:8080"
    environment:
      KAFKA_CONNECT_URIS: http://kafka-connect:8083
    depends_on:
      kafka-connect:
        condition: service_healthy
      postgres:
        condition: service_healthy

networks:
  practicum:
    name: practicum
