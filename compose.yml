  kafka-mirror-init:
    image: confluentinc/cp-kafka:latest
    container_name: kafka-mirror-init
    depends_on:
      kafka-mirror-1:
        condition: service_healthy
      kafka-mirror-2:
        condition: service_healthy
      kafka-mirror-3:
        condition: service_healthy
